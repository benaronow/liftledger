appId: app.liftledger.mobile
# Add an add-on exercise via FAB -> Edit Exercises -> insert row. The exercise
# is inserted at position POS (the add-row above the exercise currently at that
# 0-based index; use the day's exercise count to append at the end).
#
# NAME is added as a custom name the first time and reused (selected as an
# existing option) on later re-adds; EQUIPMENT and WEIGHT_TYPE are selected from
# existing options (seeded). Params: POS, NAME, EQUIPMENT, WEIGHT_TYPE.
---
- tapOn:
    id: "fab-more-actions"
# Wait for the dial's action FABs to render before tapping — a bare tapOn here
# races the open transition.
- extendedWaitUntil:
    visible:
      id: "fab-edit-exercises"
    timeout: 5000
- tapOn:
    id: "fab-edit-exercises"
- extendedWaitUntil:
    visible:
      text: "insert-exercise-${POS}"
    timeout: 5000
- tapOn: "insert-exercise-${POS}"
- extendedWaitUntil:
    visible:
      text: "Add Exercise"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 300

# --- Name: pick the existing option if the name is already in the list (a
# re-add of a name custom-added earlier in the flow — custom names persist even
# after the add-on exercise itself is dropped), otherwise add it as custom. ---
- tapOn: "Exercise"
- extendedWaitUntil:
    visible:
      id: "select-search"
    timeout: 5000
- tapOn:
    id: "select-search"
- inputText: "${NAME}"
- waitForAnimationToEnd:
    timeout: 300
- runFlow:
    when:
      visible:
        id: "select-option-${NAME}"
    commands:
      - tapOn:
          id: "select-option-${NAME}"
- runFlow:
    when:
      visible:
        id: "select-add-custom"
    commands:
      - tapOn:
          id: "select-add-custom"

# --- Equipment: typed to filter, then the existing option is picked ---
- tapOn: "Equipment"
- extendedWaitUntil:
    visible:
      id: "select-search"
    timeout: 5000
- tapOn:
    id: "select-search"
- inputText: "${EQUIPMENT}"
- tapOn:
    id: "select-option-${EQUIPMENT}"

# --- Weight type: fixed options (lbs/kgs), pick directly ---
- tapOn: "Weight Type"
- extendedWaitUntil:
    visible:
      id: "select-option-${WEIGHT_TYPE}"
    timeout: 5000
- tapOn:
    id: "select-option-${WEIGHT_TYPE}"

# Save the new exercise, then close the Edit Exercises sheet.
- tapOn: "Add"
- extendedWaitUntil:
    notVisible:
      text: "Add Exercise"
    timeout: 5000
- tapOn: "Done"
- extendedWaitUntil:
    notVisible:
      text: "Edit Exercises"
    timeout: 5000
