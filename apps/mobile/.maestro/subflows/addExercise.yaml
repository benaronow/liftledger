appId: app.liftledger.mobile
# Add an add-on exercise via FAB -> Edit Exercises -> insert row. The exercise
# is inserted at position POS (the add-row above the exercise currently at that
# 0-based index; use the day's exercise count to append at the end).
#
# EQUIPMENT and WEIGHT_TYPE are selected from existing (seeded) options. NAME is
# either added as a custom option (first use) or selected from the list (a re-add
# of a name custom-added earlier in the flow — custom names persist even after
# the add-on exercise itself is dropped). The caller states which via EXISTING:
#   EXISTING: "false" -> first use, tap the "Add ..." footer to create it.
#   EXISTING: "true"  -> re-add, tap the existing option.
# Branching on the param (not on which row happens to render) keeps it
# deterministic: no waiting on the not-taken branch's element to time out, and no
# risk of a mistyped name silently falling through to "add custom".
# Params: POS, NAME, EQUIPMENT, WEIGHT_TYPE, EXISTING.
---
- tapOn:
    id: "fab-more-actions"
# Wait for the dial's action FABs to render before tapping — a bare tapOn here
# races the open transition.
- extendedWaitUntil:
    visible:
      id: "fab-edit-exercises"
    timeout: 5000
- tapOn:
    id: "fab-edit-exercises"
- extendedWaitUntil:
    visible:
      text: "insert-exercise-${POS}"
    timeout: 5000
- tapOn: "insert-exercise-${POS}"
- extendedWaitUntil:
    visible:
      text: "Add Exercise"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 300

# --- Name: type to filter, then pick the existing option or add it as custom
# per EXISTING. The wait AFTER tapping the field (before inputText) lets the
# native keyboard finish sliding in — otherwise it races the typing and drops
# characters, which is how a mistyped name would leak through as a custom add. ---
- tapOn: "Exercise"
- extendedWaitUntil:
    visible:
      id: "select-search"
    timeout: 5000
- tapOn:
    id: "select-search"
- waitForAnimationToEnd:
    timeout: 300
- inputText: "${NAME}"
- runFlow:
    when:
      true: ${EXISTING == 'true'}
    commands:
      - tapOn:
          id: "select-option-${NAME}"
- runFlow:
    when:
      true: ${EXISTING == 'false'}
    commands:
      - tapOn:
          id: "select-add-custom"

# --- Equipment: typed to filter, then the existing option is picked. Same
# keyboard-settle wait before typing as the name field above. ---
- tapOn: "Equipment"
- extendedWaitUntil:
    visible:
      id: "select-search"
    timeout: 5000
- tapOn:
    id: "select-search"
- waitForAnimationToEnd:
    timeout: 300
- inputText: "${EQUIPMENT}"
- tapOn:
    id: "select-option-${EQUIPMENT}"

# --- Weight type: fixed options (lbs/kgs), pick directly ---
- tapOn: "Weight Type"
- extendedWaitUntil:
    visible:
      id: "select-option-${WEIGHT_TYPE}"
    timeout: 5000
- tapOn:
    id: "select-option-${WEIGHT_TYPE}"

# Save the new exercise, then close the Edit Exercises sheet.
- tapOn: "Add"
- extendedWaitUntil:
    notVisible:
      text: "Add Exercise"
    timeout: 5000
- tapOn: "Done"
- extendedWaitUntil:
    notVisible:
      text: "Edit Exercises"
    timeout: 5000
