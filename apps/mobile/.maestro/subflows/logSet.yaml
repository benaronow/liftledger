appId: app.liftledger.mobile
# Log one set as completed at the given WEIGHT x REPS (covers both plain
# completions and "e" edits from the doc — same action, we always target the
# actual values). Params: SET (0-based index within the exercise), WEIGHT, REPS.
---
- tapOn:
    id: "set-row-${SET}"
# Wait for the dialog's reps field before interacting. The dialog no longer
# animates under E2E (TopSheet duration 0), so no settle wait is needed here.
# Keep the wait AFTER tapping the field though: the native keyboard slide-in
# still races the erase/input below and would drop the typed value (leaving the
# planned value submitted instead of the edited one).
- extendedWaitUntil:
    visible:
      id: "set-input-reps"
    timeout: 5000
- tapOn:
    id: "set-input-reps"
- waitForAnimationToEnd:
    timeout: 300
# The field pre-fills with the planned/carried value; only erase+retype when it
# differs from the target (many sets log the same value they carried in).
- copyTextFrom:
    id: "set-input-reps"
- runFlow:
    when:
      true: ${maestro.copiedText != REPS}
    commands:
      - eraseText: 8
      - inputText: "${REPS}"
- tapOn:
    id: "set-input-weight"
- copyTextFrom:
    id: "set-input-weight"
- runFlow:
    when:
      true: ${maestro.copiedText != WEIGHT}
    commands:
      - eraseText: 8
      - inputText: "${WEIGHT}"
# The number-pad has no dismiss key and covers the dialog's actions. Tapping the
# (non-input) title dismisses the keyboard via the dialog's tap-to-dismiss,
# revealing Confirm.
- tapOn: "Submit Set"
# Submitting now closes the dialog outright (no auto rest-timer). notVisible only
# passes once the sheet has unmounted (after its close), so it already covers the
# close — no separate animation wait needed before the next set's row tap.
- tapOn: "Confirm"
- extendedWaitUntil:
    notVisible:
      text: "Submit Set"
    timeout: 5000
