appId: app.liftledger.mobile
# Switch the CURRENT session's gym via FAB -> Change Gym. This must run BEFORE
# any set in the session is logged: the "Change Gym" action is hidden once the
# session has started (a set is completed/skipped), i.e. `!isSessionStarted`.
#
# Switching a session's gym repopulates every not-yet-started exercise from that
# gym's history (getNewSetsFromLatest, gym-scoped by name+equipment+gym):
#   - first visit to a gym (no history there) -> sets reset to blank (0 reps /
#     0<unit>), carrying only the set COUNT from the exercise's latest occurrence
#     at any gym.
#   - a return visit -> sets repopulate from the latest completion at THAT gym.
#
# The seed only knows "Gym 1", so a gym is added as a custom option the first
# time it's used and picked from the list on later switches. The caller states
# which via EXISTING:
#   EXISTING: "false" -> first switch to this gym, tap the "Add ..." footer.
#   EXISTING: "true"  -> a later switch, tap the existing option.
# Branching on the param (not on which row renders) keeps it deterministic: no
# waiting on the not-taken branch's element to time out, and no risk of a
# mistyped gym name silently creating a bogus custom gym. Params: GYM, EXISTING.
---
- tapOn:
    id: "fab-more-actions"
# Wait for the dial's action FABs to render before tapping — a bare tapOn here
# races the open transition.
- extendedWaitUntil:
    visible:
      id: "fab-change-gym"
    timeout: 5000
- tapOn:
    id: "fab-change-gym"
- extendedWaitUntil:
    visible:
      text: "Change Gym"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 300

# Open the gym SearchableSelect and type the target gym to filter. The wait
# after tapping the field lets the native keyboard finish sliding in. The filter
# still re-runs a Fuse search and re-renders the option list on every keystroke,
# which lags this controlled field and can drop a character from a fast
# inputText — leaking through as a bogus custom gym. So type, read the field
# back, and retype until it matches.
- tapOn: "Session Gym"
- extendedWaitUntil:
    visible:
      id: "select-search"
    timeout: 5000
- tapOn:
    id: "select-search"
- waitForAnimationToEnd:
    timeout: 300
- copyTextFrom:
    id: "select-search"
- repeat:
    while:
      true: ${maestro.copiedText != GYM}
    commands:
      - eraseText
      - inputText: "${GYM}"
      - copyTextFrom:
          id: "select-search"

# Existing gym -> tap its option; new gym -> add it as a custom option (which
# also selects it).
- runFlow:
    when:
      true: ${EXISTING == 'true'}
    commands:
      - tapOn:
          id: "select-option-${GYM}"
- runFlow:
    when:
      true: ${EXISTING == 'false'}
    commands:
      - tapOn:
          id: "select-add-custom"

# Selecting closes the SearchableSelect modal; confirm the gym change on the
# dialog underneath (enabled only because the gym now differs from the current).
- extendedWaitUntil:
    notVisible:
      id: "select-search"
    timeout: 5000
- tapOn: "Confirm"
- extendedWaitUntil:
    notVisible:
      text: "Change Gym"
    timeout: 5000
