appId: app.liftledger.mobile
# Add an add-on set (the "+" in the Sets header, enabled once an exercise is
# fully complete) at WEIGHT x REPS. Same dialog as logSet; the new set pre-fills
# from the last set's values. Params: WEIGHT, REPS.
---
- tapOn: "Add set"
# No dialog-settle wait: the dialog doesn't animate under E2E. The wait after
# tapping the field stays — the native keyboard slide still races erase/input.
- extendedWaitUntil:
    visible:
      id: "set-input-reps"
    timeout: 5000
- tapOn:
    id: "set-input-reps"
- waitForAnimationToEnd:
    timeout: 300
# Pre-fills from the last set; only erase+retype when it differs from the target.
- copyTextFrom:
    id: "set-input-reps"
- runFlow:
    when:
      true: ${maestro.copiedText != REPS}
    commands:
      - eraseText: 8
      - inputText: "${REPS}"
- tapOn:
    id: "set-input-weight"
- copyTextFrom:
    id: "set-input-weight"
- runFlow:
    when:
      true: ${maestro.copiedText != WEIGHT}
    commands:
      - eraseText: 8
      - inputText: "${WEIGHT}"
# Tap the (non-input) title to dismiss the number-pad and reveal Confirm.
- tapOn: "Submit Set"
- tapOn: "Confirm"
- extendedWaitUntil:
    notVisible:
      text: "Submit Set"
    timeout: 5000
