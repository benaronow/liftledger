appId: app.liftledger.mobile
# Skip one set (doc "Skip"). Param: SET (0-based index within the exercise).
---
- tapOn:
    id: "set-row-working-${SET}"
- extendedWaitUntil:
    visible:
      id: "set-input-reps"
    timeout: 5000
- tapOn: "Skip Set"
# Skipping now closes the dialog outright; notVisible only passes once the sheet
# has unmounted, so it already covers the close before the next row tap.
- extendedWaitUntil:
    notVisible:
      text: "Submit Set"
    timeout: 5000
